general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session    # the only lock: on suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && hyprctl hyprsunset gamma 100
}

# Relaxed profile, toggled via Super+Shift+I (see scripts/idle-toggle)

# Blank the screens (gamma 0 through hyprsunset) instead of DPMS off: black is
# as good as off for the OLED, and the DisplayPort link stays up, avoiding the
# NVIDIA DSC link-training failure on wake.
listener {
    timeout = 60
    on-timeout = hyprctl hyprsunset gamma 0
    on-resume = hyprctl hyprsunset gamma 100
}

# Suspend the system
listener {
    timeout = 3600
    on-timeout = loginctl suspend
}
