general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && hyprctl hyprsunset gamma 100
}

# Relaxed profile, toggled via Super+Shift+I (see scripts/idle-toggle)

# Undocked and docked get different timelines; scripts/idle-when picks per
# listener, so the dock state is checked when each one fires.

# Docked (and cosmo): blank the screens (gamma 0 through hyprsunset) instead of
# DPMS off: black is as good as off for the OLED, and the DisplayPort link stays
# up, avoiding the NVIDIA DSC link-training failure on wake. Only locks on suspend.
listener {
    timeout = 60
    on-timeout = $HOME/.config/scripts/idle-when docked hyprctl hyprsunset gamma 0
    on-resume = hyprctl hyprsunset gamma 100
}

# Undocked laptop: lock and turn the panel off, as before the dock split
listener {
    timeout = 2700
    on-timeout = $HOME/.config/scripts/idle-when undocked loginctl lock-session
}

listener {
    timeout = 1200
    on-timeout = $HOME/.config/scripts/idle-when undocked hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Suspend the system
listener {
    timeout = 3600
    on-timeout = loginctl suspend
}
